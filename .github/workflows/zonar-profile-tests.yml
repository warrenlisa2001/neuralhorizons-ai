name: Zonar security and tenant tests

on:
  pull_request:
    paths:
      - "src/index.js"
      - "src/zonar-auth.js"
      - "src/zonar-permissions.js"
      - "src/zonar-tenant-data.js"
      - "src/zonar-audit.js"
      - "src/zonar-file-storage.js"
      - "src/zonar-reconciliation.js"
      - "src/zonar-reconciliation-pipeline.js"
      - "src/zonar-reconciliation-runs.js"
      - "src/zonar-async-reconciliation.js"
      - "tests/zonar-async-reconciliation.test.mjs"
      - "src/zonar-reconciliation-results.js"
      - "src/zonar-operational-events.js"
      - "tests/zonar-operational-events.test.mjs"
      - "tests/zonar-reconciliation-runs.test.mjs"
      - "src/zonar-operational-events.js"
      - "tests/zonar-operational-events.test.mjs"
      - "tests/zonar-operational-schema.test.mjs"
      - "tests/zonar-operational-events.test.mjs"
      - "src/zonar-csv-ingestion.js"
      - "src/zonar-csv-stream.js"
      - "tests/zonar-csv-stream.test.mjs"
      - "tests/zonar-file-storage.test.mjs"
      - "tests/zonar-reconciliation.test.mjs"
      - "tests/zonar-reconciliation-pipeline.test.mjs"
      - "tests/zonar-csv-ingestion.test.mjs"
      - "tests/zonar-csv-stream.test.mjs"
      - "migrations/**"
      - "tests/zonar-profile.test.mjs"
      - "tests/zonar-tenant-schema.test.mjs"
      - "tests/zonar-auth.test.mjs"
      - "tests/zonar-permissions.test.mjs"
      - "tests/zonar-tenant-access-route.test.mjs"
      - "tests/zonar-tenant-data.test.mjs"
      - "tests/zonar-audit.test.mjs"
      - "tests/zonar-workspace.test.mjs"
      - "dist/zonar-os/workspace/**"
      - ".github/workflows/zonar-profile-tests.yml"
  push:
    branches:
      - main
      - "feature/zonar-csv-profile"
      - "feature/zonar-csv-ingestion-foundation"
      - "feature/zonar-reconciliation-pipeline"
    paths:
      - "src/index.js"
      - "src/zonar-auth.js"
      - "src/zonar-permissions.js"
      - "src/zonar-tenant-data.js"
      - "src/zonar-audit.js"
      - "src/zonar-file-storage.js"
      - "src/zonar-reconciliation.js"
      - "src/zonar-reconciliation-pipeline.js"
      - "src/zonar-reconciliation-runs.js"
      - "src/zonar-async-reconciliation.js"
      - "tests/zonar-async-reconciliation.test.mjs"
      - "src/zonar-reconciliation-results.js"
      - "src/zonar-operational-events.js"
      - "tests/zonar-operational-events.test.mjs"
      - "tests/zonar-operational-schema.test.mjs"
      - "tests/zonar-reconciliation-runs.test.mjs"
      - "src/zonar-csv-ingestion.js"
      - "migrations/**"
      - "tests/zonar-profile.test.mjs"
      - "tests/zonar-tenant-schema.test.mjs"
      - "tests/zonar-auth.test.mjs"
      - "tests/zonar-permissions.test.mjs"
      - "tests/zonar-tenant-access-route.test.mjs"
      - "tests/zonar-tenant-data.test.mjs"
      - "tests/zonar-audit.test.mjs"
      - "tests/zonar-workspace.test.mjs"
      - "tests/zonar-file-storage.test.mjs"
      - "tests/zonar-reconciliation.test.mjs"
      - "tests/zonar-reconciliation-pipeline.test.mjs"
      - "tests/zonar-csv-ingestion.test.mjs"
      - ".github/workflows/zonar-profile-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Zonar security, schema, authentication, ingestion and reconciliation tests
        run: node --test tests/zonar-profile.test.mjs tests/zonar-tenant-schema.test.mjs tests/zonar-auth.test.mjs tests/zonar-permissions.test.mjs tests/zonar-tenant-access-route.test.mjs tests/zonar-tenant-data.test.mjs tests/zonar-audit.test.mjs tests/zonar-workspace.test.mjs tests/zonar-file-storage.test.mjs tests/zonar-reconciliation.test.mjs tests/zonar-csv-ingestion.test.mjs tests/zonar-csv-stream.test.mjs tests/zonar-reconciliation-pipeline.test.mjs tests/zonar-reconciliation-runs.test.mjs tests/zonar-operational-schema.test.mjs tests/zonar-operational-events.test.mjs tests/zonar-async-reconciliation.test.mjs
