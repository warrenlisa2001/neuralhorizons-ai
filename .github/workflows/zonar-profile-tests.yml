name: Zonar security and tenant tests

on:
  pull_request:
    paths:
      - "src/index.js"
      - "src/zonar-auth.js"
      - "migrations/**"
      - "tests/zonar-profile.test.mjs"
      - "tests/zonar-tenant-schema.test.mjs"
      - "tests/zonar-auth.test.mjs"
      - ".github/workflows/zonar-profile-tests.yml"
  push:
    branches:
      - main
      - "feature/zonar-csv-profile"
    paths:
      - "src/index.js"
      - "src/zonar-auth.js"
      - "migrations/**"
      - "tests/zonar-profile.test.mjs"
      - "tests/zonar-tenant-schema.test.mjs"
      - "tests/zonar-auth.test.mjs"
      - ".github/workflows/zonar-profile-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Zonar security, schema and tenant auth tests
        run: node --test tests/zonar-profile.test.mjs tests/zonar-tenant-schema.test.mjs tests/zonar-auth.test.mjs
