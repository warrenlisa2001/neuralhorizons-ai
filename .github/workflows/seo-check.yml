name: SEO and AI-readiness check
on:
  pull_request:
    paths: ["dist/**", "scripts/seo-check.py"]
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/seo-check.py
